<svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t-bohr">
  <title id="t-bohr">The Bohr model: quantized electron orbits and a photon emission</title>
  <desc>A central nucleus with three concentric electron orbits; an electron drops from the outer orbit to a lower one, emitting a photon, marked in red.</desc>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#121212"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C8102E"/></marker>
  </defs>
  <rect x="0" y="0" width="520" height="400" fill="#FFFFFF"/>
  <text x="260" y="34" text-anchor="middle" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="17" fill="#121212">The Bohr model: quantized orbits</text>

  <!-- orbits -->
  <circle cx="250" cy="215" r="48" fill="none" stroke="#ADADAD" stroke-width="1"/>
  <circle cx="250" cy="215" r="92" fill="none" stroke="#ADADAD" stroke-width="1"/>
  <circle cx="250" cy="215" r="136" fill="none" stroke="#D4D4D4" stroke-width="1"/>

  <!-- nucleus -->
  <circle cx="250" cy="215" r="13" fill="#121212"/>
  <text x="250" y="219" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#FFFFFF">+</text>
  <text x="250" y="252" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">nucleus</text>

  <!-- electrons on orbits -->
  <circle cx="298" cy="215" r="5" fill="#121212"/>
  <circle cx="250" cy="123" r="5" fill="#121212"/>
  <circle cx="186" cy="260" r="5" fill="#121212"/>

  <!-- orbit labels -->
  <text x="250" y="160" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">n=1</text>
  <text x="250" y="116" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">n=2</text>
  <text x="385" y="215" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">n=3</text>

  <!-- transition: electron drops n=3 -> n=2, emits photon (RED accent = the one thing to look at) -->
  <circle cx="372" cy="170" r="5" fill="#C8102E"/>
  <path d="M 368 175 Q 330 150 300 138" fill="none" stroke="#C8102E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arR)"/>
  <path d="M 392 168 l 34 -20 l -6 -2 m 6 2 l -2 6" fill="none" stroke="#C8102E" stroke-width="1.5" marker-end="url(#arR)"/>
  <text x="442" y="150" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#C8102E">photon</text>
  <text x="438" y="164" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#C8102E">hf = E₃−E₂</text>

  <text x="260" y="388" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">REDRAWN IN HOUSE STYLE · REF: WIKIMEDIA COMMONS "BOHR ATOM MODEL"</text>
</svg>
